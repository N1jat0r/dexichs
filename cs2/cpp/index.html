<title>CS2: C++ Edition — de_mirage</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0a09; overflow: hidden; }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #0b0a09; }
  #canvas { display: block; background: #12100e; outline: none; image-rendering: auto; touch-action: none;
            -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  html, body { overscroll-behavior: none; touch-action: none; }
  #rotate { display: none; position: fixed; inset: 0; z-index: 3; align-items: center; justify-content: center; flex-direction: column;
            background: #12100e; color: #ffbe46; font: 700 26px Arial, sans-serif; text-align: center; padding: 24px; }
  #rotate small { color: #aaa; font: 600 16px Arial, sans-serif; margin-top: 10px; }
  @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
  #boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
          color: #ffbe46; font: 700 64px Arial, sans-serif; background: #12100e; z-index: 2; }
  #boot small { color: #aaa; font: 600 18px Arial, sans-serif; margin-top: 14px; }
  #boot .bar { width: 320px; height: 10px; background: #333; margin-top: 18px; }
  #boot .bar i { display: block; height: 100%; width: 0; background: #ffbe46; transition: width .2s; }
</style>

<body>
<div id="stage"><canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas></div>
<div id="rotate">Поверните телефон горизонтально<small>Игра работает в альбомном режиме</small></div>
<div id="boot">CS2<small id="bootmsg">C++ Edition · загрузка...</small><div class="bar"><i id="bootbar"></i></div></div>
<script>
var Module = {
  // каждая сборка — свой номер: браузер не возьмёт старые cs2.js / cs2.wasm из кэша
  locateFile: function(p){ return p + "?v=1792605627"; },
  canvas: document.getElementById('canvas'),
  setStatus: function(t){
    var m = /\((\d+(\.\d+)?)\/(\d+)\)/.exec(t || '');
    if (m) document.getElementById('bootbar').style.width = (100 * m[1] / m[3]) + '%';
  },
  print: function(t){ console.log(t); },
  printErr: function(t){ console.warn(t); },
  onRuntimeInitialized: function(){ document.getElementById('boot').style.display = 'none'; }
};
// холст по размеру окна (16:9, без искажений)
function cs2Fit(){
  var c = document.getElementById('canvas');
  var fit = !globalThis.cs2 || cs2.fit !== false;
  var W = innerWidth, H = innerHeight, k = Math.min(W / 960, H / 540);
  if (!fit) k = Math.min(1, k);
  c.style.width = Math.floor(960 * k) + 'px';
  c.style.height = Math.floor(540 * k) + 'px';
}
addEventListener('resize', cs2Fit);
cs2Fit();
</script>
<script async src="cs2.js?v=1792605627"></script>
</body>
